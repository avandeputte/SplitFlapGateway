; ============================================================================
;  Split-Flap Gateway -- PlatformIO project
;  Target: Waveshare ESP32-S3-RS485-CAN  (ESP32-S3, 16MB flash, OPI PSRAM)
;
;  This is the supported build configuration (the Arduino IDE / .ino path has been
;  removed). The settings below encode the full ESP32-S3 board configuration; the
;  right-hand column maps each one to the equivalent "ESP32S3 Dev Module" board-menu
;  option, for reference:
;
;    Board ........................ ESP32S3 Dev Module  -> esp32-s3-devkitc-1
;    USB CDC On Boot .............. Disabled            -> ARDUINO_USB_CDC_ON_BOOT=0
;    CPU Frequency ................ 240MHz (WiFi)       -> board_build.f_cpu
;    Core Debug Level ............. None                -> CORE_DEBUG_LEVEL=0
;    USB DFU On Boot .............. Disabled            -> ARDUINO_USB_DFU_ON_BOOT=0
;    Erase All Flash Before Upload  Disabled            -> (default; no erase flag)
;    Events Run On ................ Core 1              -> ARDUINO_EVENT_RUNNING_CORE=1
;    Flash Mode ................... QIO 80MHz           -> flash_mode=qio, f_flash=80M
;    Flash Size ................... 16MB (128Mb)        -> board_upload.flash_size=16MB
;    JTAG Adapter ................. Disabled            -> (no flag needed)
;    Arduino Runs On .............. Core 1              -> ARDUINO_RUNNING_CORE=1
;    USB Firmware MSC On Boot ..... Disabled            -> ARDUINO_USB_MSC_ON_BOOT=0
;    Partition Scheme ............. 16M (3MB APP/9.9M FATFS) -> app3M_fat9M_16MB.csv
;    PSRAM ........................ OPI PSRAM           -> memory_type=qio_opi + BOARD_HAS_PSRAM
;    Upload Mode .................. UART0 / Hardware CDC -> serial upload
;    Upload Speed ................. 921600              -> upload_speed=921600
;    USB Mode ..................... Hardware CDC and JTAG -> ARDUINO_USB_MODE=1
;    Zigbee Mode .................. Disabled            -> (no flag needed)
;
;  Build:   pio run
;  Upload:  pio run -t upload
;  Monitor: pio device monitor
; ============================================================================

[env:esp32s3_devmodule]
; Arduino-ESP32 core 3.x (the firmware requires "ESP32 Arduino core >= 3.0").
; Uses the pioarduino platform fork, which tracks the modern Arduino-ESP32 3.x core.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ---- Clock / flash / PSRAM (Arduino IDE board menu equivalents) ----
board_build.f_cpu = 240000000L          ; CPU Frequency: 240MHz (WiFi)
board_build.flash_mode = qio            ; Flash Mode: QIO ...
board_build.f_flash = 80000000L         ; ... 80MHz
board_upload.flash_size = 16MB          ; Flash Size: 16MB (128Mb)
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi   ; PSRAM: OPI PSRAM (QIO flash + OPI PSRAM variant)

; ---- Partition table: "16M Flash (3MB APP/9.9MB FATFS)" ----
board_build.partitions = app3M_fat9M_16MB.csv
board_build.filesystem = fatfs          ; firmware uses FFat for runtime persistence

; ---- Compile-time macros that mirror the remaining board-menu toggles ----
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0         ; USB CDC On Boot: Disabled
    -DARDUINO_USB_MODE=1               ; USB Mode: Hardware CDC and JTAG
    -DARDUINO_USB_DFU_ON_BOOT=0        ; USB DFU On Boot: Disabled
    -DARDUINO_USB_MSC_ON_BOOT=0        ; USB Firmware MSC On Boot: Disabled
    -DARDUINO_RUNNING_CORE=1           ; Arduino Runs On: Core 1
    -DARDUINO_EVENT_RUNNING_CORE=1     ; Events Run On: Core 1
    -DCORE_DEBUG_LEVEL=0               ; Core Debug Level: None

; ---- Upload (UART0 / Hardware CDC @ 921600) ----
upload_protocol = esptool
upload_speed = 921600
; Default macOS port for this machine. Comment out to let PlatformIO auto-detect
; (the cu.usbmodem number changes between plug-ins / boards / machines).
upload_port = /dev/cu.usbmodem114101

; ---- Serial monitor (firmware calls Serial.begin(115200)) ----
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem114101

; ---- External libraries (the rest are bundled with the Arduino-ESP32 core) ----
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7
