openapi: 3.1.0
info:
  title: Split-Flap Gateway API
  version: "3.2.0"
  description: |
    REST API for the ESP32-S3 Split-Flap Gateway firmware. The version above is the
    API version `GET /api/capabilities` reports as `api`; the firmware has its own.

    **Base URL:** `http://<gateway-ip>` — replace with the gateway's IP
    (shown on the Status page), or use `http://192.168.4.1` when connected to
    the AP fallback network.

    All `POST` endpoints accept and return `application/json`.
    All endpoints include `Access-Control-Allow-Origin: *`.

servers:
  - url: http://192.168.4.1
    description: AP fallback (default)
  - url: http://{ip}
    description: Station IP (after WiFi connect)
    variables:
      ip:
        default: "192.168.1.100"
        description: Gateway IP address

tags:
  - name: Bus
    description: Raw RS-485 bus access
  - name: Modules
    description: Split-flap module display control
  - name: Advanced
    description: Low-level module configuration commands
  - name: Provision
    description: Module provisioning and identity management
  - name: Status
    description: System status and diagnostics
  - name: Config
    description: Persistent configuration
  - name: Companion
    description: Companion-app registration and its settings blob store
  - name: Restore
    description: Restore-on-boot — a stored calibration backup replayed to every module (v3.12)
  - name: UI
    description: The dashboard itself (translation dictionaries)
  - name: OTA
    description: Over-the-air firmware update

paths:

  # ── RS-485 Bus ──────────────────────────────────────────────────

  /api/rs485/messages:
    get:
      tags: [Bus]
      summary: Drain buffered bus frames
      description: Returns all frames since the last call (up to 64). Each call drains the buffer.
      responses:
        "200":
          description: Array of bus frames (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusFrame"

  /api/rs485/send:
    post:
      tags: [Bus]
      summary: Send a raw ASCII frame to the bus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  description: >
                    ASCII frame to transmit. A trailing newline is optional — the
                    gateway normalizes framing (adds/strips the terminator and trims
                    any bytes past a complete known command) unless `raw` is true.
                raw:
                  type: boolean
                  default: false
                  description: >
                    When true, the bytes in `data` are sent verbatim with no
                    sanitization or terminator changes (debugging escape hatch).
            examples:
              home_all:
                value: { data: "m*h" }
              version_all:
                value: { data: "m*v" }
              show_char:
                value: { data: "m5-A" }
              raw_verbatim:
                value: { data: "m4vDSassa", raw: true }
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/rs485/batch:
    post:
      tags: [Bus]
      summary: Send many raw frames in one request (v3.0)
      description: |
        Sends each frame in `frames` to the bus in order, normalized like
        `/api/rs485/send`. An optional `step_ms` paces the cascade device-side.
        Lets a host draw a whole animated page in one HTTP call instead of one
        request per module. Capped at 512 frames per request.

        **v3.4 — pacing is queued, not blocking.** A paced frame is stamped with a
        due time and handed to the bus task, which sends it when due; the handler
        no longer sleeps between frames. So the call **returns immediately** and
        `200` means the frames were **accepted**, not that they are on the wire —
        `sent` counts frames accepted. (Before 3.4 the handler blocked for the whole
        cascade, freezing the single-connection web server for up to 8 s; that 8 s
        total-pacing cap is gone with it.)

        Up to 127 paced frames are in flight at once. A frame is sent immediately
        instead of being paced when `step_ms` is 0, when the frame exceeds 48 bytes,
        or when the queue is full — so a cascade longer than 127 paced frames loses
        its pacing beyond that point.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frames]
              properties:
                frames:
                  type: array
                  items: { type: string }
                  description: ASCII frames, e.g. ["m00-A\n","m01-B\n"]
                step_ms:
                  type: integer
                  default: 0
                  description: Delay (0–100 ms) between frames, for a paced cascade.
            example: { frames: ["m00-A\n", "m01-B\n", "m02-y\n"], step_ms: 15 }
      responses:
        "200":
          description: How many frames were sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:   { type: boolean, example: true }
                  sent: { type: integer, example: 45 }
        "400":
          $ref: "#/components/responses/BadRequest"

  # ── Module display control ──────────────────────────────────────

  /api/display/state:
    get:
      tags: [Display]
      summary: Current visual state of the split-flap wall
      description: |
        Returns the configured grid dimensions and the character shown in each
        cell. Cells map to module IDs left-to-right, top-to-bottom (cell index =
        row*cols + col == module id). Each cell is the tracked character, "?" if
        a module is present but its character is unknown (e.g. after a home or an
        index set), or null if no module has that id. Drives the Live Display.

        Cells report what the flap SHOWS (v4.1): a symbol flap as its symbol (♥ ↑ ↓
        ☺ ← →) and the double-quote flap as '"', never the letters the wire uses.
        Colour flaps stay their letters, as on the Matrix Gateway.
      responses:
        "200":
          description: Display state
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:  { type: integer, example: 1 }
                  cols:  { type: integer, example: 16 }
                  cells:
                    type: array
                    items: { type: [string, "null"] }
                    example: [" ","1","2",":","0","4","A","M",null,null]

  /api/flap/modules:
    get:
      tags: [Modules]
      summary: List all known modules
      responses:
        "200":
          description: Array of module objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"

  /api/flap/identify:
    post:
      tags: [Modules]
      summary: Clear the module list and re-discover all modules
      description: |
        Wipes both the in-memory registry and the persisted module file, then
        broadcasts `m*v` so every module re-announces its version and serial
        number. This is the "Identify All" action in the web UI. Allow a few
        seconds for all modules to respond before reading `/api/flap/modules`.
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/flap/char:
    post:
      tags: [Modules]
      summary: Show a character on a module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, char]
              properties:
                id:
                  type: integer
                  description: Module ID (0–254), or -1 to broadcast to all
                char:
                  type: string
                  description: >
                    A single character (UTF-8). The gateway uppercases ASCII
                    letters — except the seven lowercase colour codes r/o/y/g/b/p/w,
                    which address the colour flaps and are sent as-is — and transcodes
                    the character to a single Windows-1252 byte (so € and accented
                    letters work), then sends m<id>-<char>; the module firmware maps
                    the byte to a flap index. Characters with no Windows-1252
                    representation are rejected.


                    SYMBOL FLAPS (v4.1): ♥ ↑ ↓ ☺ ← → are resolved against THAT module's
                    reel — the reel's own flap when it carries one, otherwise a stand-in
                    that reel does have (♥→*, ☺→:, ↓→V) or a blank. Their emoji forms
                    (❤ ⬆ ⬇ ⬅ ➡ 🙂 😊 😀) and a trailing variation selector are accepted
                    too. A TYPED letter is never a symbol: 'h' is still an H. With
                    id:-1 the gateway sends one frame when every reel agrees and a frame
                    per module when they do not, so a heart never lands as an 'h'.
            example: { id: 5, char: "A" }
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/flap/index:
    post:
      tags: [Modules]
      summary: Show a flap by index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, index]
              properties:
                id:
                  type: integer
                index:
                  type: integer
                  minimum: 0
                  maximum: 63
            example: { id: 5, index: 1 }
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/flap/text:
    post:
      tags: [Modules]
      summary: Send a text string across sequential modules
      description: |
        One glyph per module, left to right from `start`. A euro sign, an accented
        letter and a symbol flap (♥ ↑ ↓ ☺ ← →, v4.1) are each ONE module however many
        UTF-8 bytes they arrived as, and each character is resolved against the reel of
        the module it lands on — so a module without the heart printed on it shows the
        stand-in (* : V) or a blank and the text does not shift around it.

        `chars` in the reply is the number of MODULES written (bytes of UTF-8 before v4.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, start]
              properties:
                text:
                  type: string
                start:
                  type: integer
                  description: ID of the first module
            example: { text: "HELLO", start: 0 }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  chars: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/display/cells:
    post:
      tags: [Modules]
      summary: Set a row of cells in one call (companion display path)
      description: |
        Sets a run of modules in a single request, using the SAME JSON contract as the Matrix
        Portal gateway's `/api/display/cells`, so a client can drive either wall through one
        endpoint. It is the "show this" companion to GET /api/capabilities ("what can you show").

        Each cell is exactly one of `ch` (a character), `color` (a named colour flag), `blank`
        (home the module), or `skip` (leave it alone). Cell `i` addresses module `start + i`.
        `step_ms` (0..100) paces the cascade; it is scheduled on the RS-485 task, never a blocking
        delay.

        LENIENT: this wall's modules each carry their own reel and may differ, so a cell that
        cannot be shown (a glyph absent from the reel, an unknown colour name, a malformed cell)
        is SKIPPED rather than failing the whole row. The response reports `sent` vs `skipped`;
        a client that needs certainty should consult /api/capabilities first. Only structural
        errors (bad JSON, missing `cells`) return 400.

        Sent by CHARACTER (`m<id>-<char>`), so each module resolves the byte against its own
        reel; lowercase folds to uppercase and `"` reaches the double-quote flap — the byte
        itself on a reel printed with it, else the reel's borrowed 'q'.

        SYMBOL FLAPS (v4.1): `{"ch":"♥"}` reaches the heart flap. Here, unlike the text
        paths, a module whose reel the gateway KNOWS and which has no heart is SKIPPED
        rather than shown a stand-in — the caller asked for a heart, and this endpoint's
        leniency is about skipping, not approximating. `/api/capabilities` says which
        symbols the wall carries (`pictographs`) and which every module carries
        (`charset.common`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cells]
              properties:
                start:   { type: integer, description: "First module id (default 0)", example: 0 }
                step_ms: { type: integer, description: "Cascade pacing, 0..100 ms", example: 15 }
                cells:
                  type: array
                  items:
                    type: object
                    properties:
                      ch:    { type: string,  description: "A character to show" }
                      color: { type: string,  enum: [red, orange, yellow, green, blue, purple, white] }
                      blank: { type: boolean, description: "Home the module" }
                      skip:  { type: boolean, description: "Leave the module unchanged" }
            example:
              start: 0
              step_ms: 15
              cells:
                - { ch: "H" }
                - { ch: "I" }
                - { color: "red" }
                - { blank: true }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  cells:   { type: integer, description: "Cells processed" }
                  sent:    { type: integer, description: "Frames transmitted" }
                  skipped: { type: integer, description: "Cells that could not be shown" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/flap/home:
    post:
      tags: [Modules]
      summary: Home one or all modules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                  description: Module ID, or -1 to home all
            examples:
              single: { value: { id: 5 } }
              all:    { value: { id: -1 } }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/flap/version:
    post:
      tags: [Modules]
      summary: Query firmware version (synchronous — waits up to 500ms)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer, minimum: 0, maximum: 254 }
            example: { id: 5 }
      responses:
        "200":
          description: Version response or timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncReply"
              examples:
                success:
                  value: { ok: true, id: 5, ver: "12", sn: "AABBCCDD", stale: false, lastSeen: 45231 }
                stale:
                  value: { ok: true, id: 5, ver: "12", sn: "AABBCCDD", stale: true, lastSeen: 38000 }
                timeout:
                  value: { ok: false, error: "no response from module" }

  /api/flap/dump:
    post:
      tags: [Modules]
      summary: Fetch EEPROM configuration (synchronous — waits up to 1s)
      description: |
        Sends the dump command and waits up to 500ms for a reply.
        For firmware v15+, tries `mXD<sn>` first; falls back to `m<id>d` if no response (up to another 500ms).
        Data is fetched fresh each call (no cache). Returns `ok:false` on timeout.
        The `stale` field is always `false` and retained only for response-shape compatibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer, minimum: 0, maximum: 254 }
            example: { id: 5 }
      responses:
        "200":
          description: EEPROM dump or timeout
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SyncReply"
                  - type: object
                    properties:
                      dump:
                        type: string
                        description: Raw EEPROM string — `homeOffset:totalSteps:0=pos,1=pos,...`
                        example: "42:4096:0=210,1=320,2=430"
              examples:
                success:
                  value: { ok: true, id: 5, sn: "AABBCCDD", dump: "42:4096:0=210,1=320", stale: false }
                stale:
                  value: { ok: true, id: 5, sn: "AABBCCDD", dump: "42:4096:0=210,1=320", stale: true }
                timeout:
                  value: { ok: false, error: "no response from module" }

  /api/flap/all:
    post:
      tags: [Modules]
      summary: Refresh version and EEPROM together (uses the v25+ combined 'A' command when possible)
      description: |
        Returns a module's firmware version, serial number, and full EEPROM dump
        in one response. For a module known to be firmware v25+, the gateway issues
        a single combined `A` command (one bus transaction) instead of a version
        query followed by a dump. Older firmware (or a module whose version isn't
        known yet) falls back to the classic version-then-dump sequence. The `mode`
        field reports which path ran (`"A"` or `"vd"`). Data is fetched fresh each
        call; `stale:true` (with cached/empty fields) indicates no reply arrived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer, minimum: 0, maximum: 254 }
            example: { id: 5 }
      responses:
        "200":
          description: Combined version + EEPROM state, or stale on timeout
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SyncReply"
                  - type: object
                    properties:
                      ver:  { type: string, description: Firmware version, example: "25" }
                      dump:
                        type: string
                        description: Raw EEPROM string — `homeOffset:totalSteps:0=pos,1=pos,...`
                        example: "42:4096:0=210,1=320"
                      mode:
                        type: string
                        enum: ["A", "vd"]
                        description: Which path ran — single `A` transaction, or version+dump fallback
                      autoHome:
                        type: integer
                        description: >-
                          Auto-home setting — `1` = home on boot, `0` = restore saved position.
                          Only the `A` path carries this; `-99` when not provided (the `vd`
                          fallback or a stale read).
                        example: 1
                      curIndex:
                        type: integer
                        description: >-
                          Module's current flap index (live state) — `0..63`, `-1` unknown,
                          `-2` motor released. `A` path only; `-99` when not provided.
                        example: 5
                      reportedId:
                        type: integer
                        description: >-
                          Module's self-reported ID from the `A` reply, for diagnosing an
                          address/identity mismatch against `id`. `-99` when not provided.
                        example: 5
                      flapCount:
                        type: integer
                        description: >-
                          Active flap count (1..64) from the configurable flap set. Firmware
                          v31+ only; `-99` when not provided (older firmware, the `vd`
                          fallback, or a stale read).
                        example: 40
                      flapChars:
                        type: string
                        description: >-
                          Ordered character set (character at each flap index) from the
                          configurable flap set, as UTF-8 (the gateway transcodes the
                          module's Windows-1252 bytes, so € and accents round-trip).
                          Firmware v31+ only; empty string when not provided.
                        example: " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
              examples:
                combined_A:
                  value: { ok: true, id: 5, ver: "31", sn: "AABBCCDD", dump: "42:4096:0=210,1=320", autoHome: 1, curIndex: 5, reportedId: 5, flapCount: 40, flapChars: " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789", stale: false, mode: "A" }
                fallback_vd:
                  value: { ok: true, id: 5, ver: "23", sn: "AABBCCDD", dump: "42:4096:0=210,1=320", autoHome: -99, curIndex: -99, reportedId: -99, flapCount: -99, flapChars: "", stale: false, mode: "vd" }
                stale:
                  value: { ok: true, id: 5, ver: "31", sn: "AABBCCDD", dump: "", autoHome: -99, curIndex: -99, reportedId: -99, flapCount: -99, flapChars: "", stale: true, mode: "A" }

  /api/flap/calibrate:
    post:
      tags: [Advanced]
      summary: Start calibration of steps per revolution (asynchronous)
      description: |
        Sends `m<id>c` and returns immediately so the web server stays
        responsive while the reel physically measures a revolution (several
        seconds). The module spins the reel a full revolution, replies
        `m<id>:<steps>\n`, and saves the measured value to its own EEPROM.

        For a single module (`id >= 0`) this **starts an asynchronous job** and
        returns `{ok, started, id}`. Poll `GET /api/flap/calibrate/status` for
        the result, then typically write the measured value back with
        `/api/flap/totalsteps` to confirm it. A broadcast (`id < 0`) is
        fire-and-forget and returns `{ok, broadcast: true}`. Starting a job for a
        different module while one is already running returns `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer, description: "Module ID, or a negative value to broadcast to all modules" }
            example: { id: 11 }
      responses:
        "200":
          description: |
            Job started (single module) or broadcast sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:        { type: boolean, example: true }
                  started:   { type: boolean, description: "true once the job is running (single-module calls)", example: true }
                  id:        { type: integer, description: "Module ID (single-module calls only)", example: 11 }
                  broadcast: { type: boolean, description: "Present and true for broadcast (id < 0) calls" }
              examples:
                started:   { value: { ok: true, started: true, id: 11 } }
                broadcast: { value: { ok: true, broadcast: true } }
        "409":
          description: A calibration job is already running for a different module.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:    { type: boolean, example: false }
                  error: { type: string,  example: "calibration already running for module 5" }

  /api/flap/calibrate/status:
    get:
      tags: [Advanced]
      summary: Poll the asynchronous calibration job
      description: |
        Returns the current state of the calibration job started by
        `POST /api/flap/calibrate`. `pending` while the reel is still measuring;
        `done` with the measured `stepsPerRev` once the module replies; `timeout`
        if no reply arrived within the window (~15 s); `idle` if no job has run.
      responses:
        "200":
          description: Current job state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:          { type: boolean, example: true }
                  state:       { type: string, enum: [idle, pending, done, timeout], example: "done" }
                  id:          { type: integer, description: "Module ID (pending/done/timeout)", example: 11 }
                  stepsPerRev: { type: integer, description: "Measured steps per revolution (state=done only)", example: 4097 }
              examples:
                pending: { value: { ok: true, state: "pending", id: 11 } }
                done:    { value: { ok: true, state: "done", id: 11, stepsPerRev: 4097 } }
                timeout: { value: { ok: true, state: "timeout", id: 11 } }
                idle:    { value: { ok: true, state: "idle" } }

  /api/flap/diag:
    post:
      tags: [Advanced]
      summary: Self-diagnostics — stats snapshot + start the Hall test (firmware v26+)
      description: |
        First step of a three-test self-diagnostics run on a module whose
        firmware is **v26 or newer**. Tests run in order **Q → T → M**:

        - **Stats snapshot (`Q`)** — instant, no motor. Captured synchronously and
          returned inline here as `q`: last reset cause (raw RSTFR bits), boot
          counter, supply voltage (mV), an EEPROM write-verify flag, and the
          current flap index. If the module does not answer, `q` is `null` (the
          Hall test is still started).
        - **Hall sensor self-test (`T`)** — started by this call; drives the motor
          ~2 revolutions to check the home sensor. Poll
          `GET /api/flap/diag/status` for the result (`kind: hall`).
        - **Mechanical self-test (`M`)** — started afterwards via
          `POST /api/flap/diag/mech` once the Hall test completes.

        Starting a run for a different module while a motor test is in flight
        returns `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer, description: "Module ID (0–254)" }
            example: { id: 11 }
      responses:
        "200":
          description: Snapshot captured (q present, or null if unanswered) and the Hall test started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean, example: true }
                  started: { type: boolean, description: "true once the Hall test is running", example: true }
                  id:      { type: integer, example: 11 }
                  q:
                    type: [object, "null"]
                    description: "Stats snapshot, or null if the module did not answer the Q query"
                    properties:
                      resetCause: { type: integer, description: "Raw RSTFR bits: 1 power-on, 2 brown-out, 4 external, 8 watchdog, 16 software (combinable)", example: 1 }
                      bootCount:  { type: integer, description: "Boots since the counter was reset (wraps at 255)", example: 3 }
                      vcc:        { type: integer, description: "Supply voltage in millivolts (0 if unavailable)", example: 3320 }
                      eepromOk:   { type: integer, description: "1 if the EEPROM write-verify passed, else 0", example: 1 }
                      curIndex:   { type: integer, description: "Current flap index (-1 unknown / needs homing, -2 released)", example: 5 }
                      rxOverflows: { type: integer, description: "Module firmware v33+: times the module's receive ring overflowed, which happens only while it is busy. -1 = not reported", example: -1 }
                      bcastSent:   { type: integer, description: "v33+: staggered broadcast replies the module actually sent -- compare with what the gateway heard to tell a reply lost on the wire from one never sent. -1 = not reported", example: -1 }
                      bcastLate:   { type: integer, description: "v33+: how many of those went out after their slot. -1 = not reported", example: -1 }
              examples:
                captured: { value: { ok: true, started: true, id: 11, q: { resetCause: 1, bootCount: 3, vcc: 3320, eepromOk: 1, curIndex: 5 } } }
                noQ:      { value: { ok: true, started: true, id: 11, q: null } }
        "400":
          description: Missing or invalid `id`.
        "409":
          description: A motor self-test is already running for a different module.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:    { type: boolean, example: false }
                  error: { type: string,  example: "diagnostics already running for module 5" }

  /api/flap/diag/mech:
    post:
      tags: [Advanced]
      summary: Run the mechanical self-test (firmware v26+; rotation count v29+)
      description: |
        Second motor test of the run — started by the UI after the Hall test
        completes. Spins the motor and measures steps-per-revolution
        consistency. Poll `GET /api/flap/diag/status` for the result
        (`kind: mech`).

        The optional `revs` field requests a rotation count (**firmware v29+**),
        clamped to **5–20** (default 5). More rotations catch intermittent faults
        but take longer (~6 s per rotation). Omit `revs` to send the bare command
        (default 5) — required for firmware v26–v28, which do not parse a count.
        The poll window scales with the count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:   { type: integer, description: "Module ID (0–254)" }
                revs: { type: integer, minimum: 5, maximum: 20, description: "Optional rotation count, firmware v29+ (default 5)" }
            example: { id: 11, revs: 10 }
      responses:
        "200":
          description: Mechanical self-test started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean, example: true }
                  started: { type: boolean, example: true }
                  id:      { type: integer, example: 11 }
                  revs:    { type: integer, description: "Rotation count actually used (clamped 5–20)", example: 10 }
              example: { ok: true, started: true, id: 11, revs: 10 }
        "400":
          description: Missing or invalid `id`.
        "409":
          description: A motor self-test is already running for a different module.

  /api/flap/diag/status:
    get:
      tags: [Advanced]
      summary: Poll the active motor self-test (Hall or mechanical)
      description: |
        Returns the state of the motor test started by `POST /api/flap/diag`
        (Hall) or `POST /api/flap/diag/mech` (mechanical). `kind` says which —
        `hall` or `mech`. `pending` while spinning; `done` with the result;
        `timeout` if no reply arrived in the window; `idle` if no job has run.

        **Hall (`kind: hall`)** — `code`: 0 OK, 1 stuck-active, 2 stuck-inactive,
        3 multiple active regions, 4 inverted polarity. `rising`/`falling` are the
        home-edge counts (healthy 1/1); `active` is the active-sample width.

        **Mechanical (`kind: mech`)** — `code`: 0 OK, 1 inconsistent (>5 % spread),
        2 no motion. `min`/`max` are steps-per-rev; `spreadTenths` is (max-min)/avg
        in tenths of a percent. `gateActive`/`gateSpan` describe the one-rev motion
        gate (used to interpret a no-motion result); `magWidth` is the average
        magnet width; `revs` is the comma-separated per-rotation step counts.
      responses:
        "200":
          description: Current job state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:           { type: boolean, example: true }
                  state:        { type: string, enum: [idle, pending, done, timeout], example: "done" }
                  kind:         { type: string, enum: [hall, mech], description: "Which motor test (omitted when idle)", example: "mech" }
                  id:           { type: integer, example: 11 }
                  code:         { type: integer, description: "Result code (state=done). Hall: 0-4. Mech: 0 OK, 1 inconsistent, 2 no motion", example: 0 }
                  rising:       { type: integer, description: "Hall only: rising home edges (healthy 1)", example: 1 }
                  active:       { type: integer, description: "Hall only: active-sample width", example: 162 }
                  falling:      { type: integer, description: "Hall only: falling home edges (healthy 1)", example: 1 }
                  min:          { type: integer, description: "Mech only: smallest steps-per-rev", example: 4090 }
                  max:          { type: integer, description: "Mech only: largest steps-per-rev", example: 4099 }
                  spreadTenths: { type: integer, description: "Mech only: (max-min)/avg in tenths of a percent", example: 3 }
                  gateActive:   { type: integer, description: "Mech only: Hall active-sample count over the motion gate", example: 162 }
                  gateSpan:     { type: integer, description: "Mech only: steps driven during the motion gate (~1.1 rev)", example: 4505 }
                  magWidth:     { type: integer, description: "Mech only: average magnet active-region width", example: 163 }
                  revs:         { type: string,  description: "Mech only: comma-separated per-rotation step counts", example: "4096,4097,4096,4094,4096" }
              examples:
                hallPending: { value: { ok: true, state: "pending", kind: "hall", id: 11 } }
                hallDone:    { value: { ok: true, state: "done", kind: "hall", id: 11, code: 0, rising: 1, active: 162, falling: 1 } }
                mechDone:    { value: { ok: true, state: "done", kind: "mech", id: 11, code: 0, min: 4094, max: 4097, spreadTenths: 0, gateActive: 162, gateSpan: 4505, magWidth: 163, revs: "4096,4097,4096,4094,4096" } }
                timeout:     { value: { ok: true, state: "timeout", kind: "mech", id: 11 } }
                idle:        { value: { ok: true, state: "idle" } }

  /api/flap/homeoffset:
    post:
      tags: [Advanced]
      summary: Set home offset (steps past Hall trigger to flap 0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, steps]
              properties:
                id:    { type: integer }
                steps: { type: integer }
            example: { id: 5, steps: 42 }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/flap/totalsteps:
    post:
      tags: [Advanced]
      summary: Set total steps per revolution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, steps]
              properties:
                id:    { type: integer }
                steps: { type: integer }
            example: { id: 5, steps: 4096 }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/flap/nudge:
    post:
      tags: [Advanced]
      summary: Nudge forward n steps (also adds to home offset)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, steps]
              properties:
                id:    { type: integer }
                steps: { type: integer }
            example: { id: 5, steps: 10 }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/flap/goto:
    post:
      tags: [Advanced]
      summary: Go to raw step position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, step]
              properties:
                id:   { type: integer }
                step: { type: integer, minimum: 0 }
            example: { id: 5, step: 100 }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/flap/writepos:
    post:
      tags: [Advanced]
      summary: Write calibrated step position for a flap index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, idx, pos]
              properties:
                id:  { type: integer }
                idx: { type: integer, minimum: 0, maximum: 63 }
                pos: { type: integer, minimum: 0 }
            example: { id: 5, idx: 1, pos: 210 }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/flap/autohome:
    post:
      tags: [Advanced]
      summary: Set auto-home flag (home on boot vs restore saved position)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, enable]
              properties:
                id:     { type: integer }
                enable: { type: integer, enum: [0, 1] }
            example: { id: 5, enable: 1 }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/flap/flapconfig:
    post:
      tags: [Advanced]
      summary: Configure a module's flap count and/or character set (firmware v31+)
      description: |
        Sets the runtime-configurable flap set introduced in module firmware v31:
        the active flap count (1–64) and the ordered character set (the character
        at each flap index). `flapCount` and `charSet` are **independent and
        optional** — supply either or both; an omitted side is left unchanged on
        the module. Target a module by `id` (use `id: -1` to broadcast the same
        flap set to every module on the bus) or by serial number (`sn`). The
        module applies the change silently (no reply); read it back with
        `/api/flap/all`. `charSet` is UTF-8 and may use any character representable
        in Windows-1252 — ASCII plus the euro sign and Western-European
        accents — and, from v4.1, the six SYMBOL flaps ♥ ↑ ↓ ☺ ← → (their emoji
        forms and a trailing variation selector are accepted too). The gateway
        transcodes it to the single-byte form the bus uses, storing each symbol as
        its wire letter (h u d s l t) — which is what the module keeps and reports,
        and what `/api/capabilities` turns back into symbols. A typed letter stays a
        letter. Characters with no representation are rejected. The limit is 64
        FLAPS: a symbol is one flap however many UTF-8 bytes it arrived as. On
        modules older than v31 the command is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:        { type: integer, minimum: -1, maximum: 254, description: "Module ID; -1 broadcasts. Use this OR sn." }
                sn:        { type: string, description: "Target by serial number instead of id." }
                flapCount: { type: integer, minimum: 1, maximum: 64, description: "Active flap count; omit to leave unchanged." }
                charSet:   { type: string, maxLength: 64, description: "Ordered character set (index 0..n), UTF-8; any Windows-1252 char (ASCII + € + accents). Omit to leave unchanged." }
            examples:
              byId:
                value: { id: 5, flapCount: 40, charSet: " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789" }
              euroAndAccents:
                value: { id: 5, charSet: " ABCDEFGHIJKLMNOPQRSTUVWXYZ€éàüöç0123456789" }
              symbolFlaps:
                summary: A reel with a heart and two arrows printed on three of its flaps
                value: { id: 5, charSet: " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789♥↑↓" }
              broadcast:
                value: { id: -1, charSet: " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789" }
              bySerial:
                value: { sn: "AABBCCDD0011223344", flapCount: 48 }
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/flap/erase:
    post:
      tags: [Advanced]
      summary: Erase calibrated flap position map
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
            example: { id: 5 }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/flap/factoryreset:
    post:
      tags: [Advanced]
      summary: Factory reset EEPROM (preserves module ID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
            example: { id: 5 }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  # ── Provisioning ─────────────────────────────────────────────────

  /api/flap/provision:
    post:
      tags: [Provision]
      summary: Assign an ID to an unprovisioned module by serial number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sn, id]
              properties:
                sn: { type: string, example: "AABBCCDD11223344" }
                id: { type: integer, minimum: 0, maximum: 254 }
            example: { sn: "AABBCCDD11223344", id: 5 }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/flap/deprovision:
    post:
      tags: [Provision]
      summary: Reset module to unprovisioned state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer, description: "Module ID, or -1 for all" }
            examples:
              single: { value: { id: 5 } }
              all:    { value: { id: -1 } }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/flap/homebysn:
    post:
      tags: [Provision]
      summary: Home a module by serial number (to identify it physically)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sn]
              properties:
                sn: { type: string, example: "AABBCCDD11223344" }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/flap/dumpbysn:
    post:
      tags: [Provision]
      summary: Dump EEPROM by serial number (firmware v15+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sn]
              properties:
                sn: { type: string, example: "AABBCCDD11223344" }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/flap/factoryresetbysn:
    post:
      tags: [Provision]
      summary: Factory reset EEPROM by serial number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sn]
              properties:
                sn: { type: string, example: "AABBCCDD11223344" }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/flap/restorebysn:
    post:
      tags: [Provision]
      summary: Restore EEPROM to a module by serial number
      description: |
        Sends `mXW<sn>:<homeOffset>:<totalSteps>:[:<flapCount>:<flapChars>]\n` (offset, steps
        and flap set; this also clears the module's flap map), then **(v3.12)** writes the map
        **entry by entry** as paced `m<id>w<i>:<p>` frames scheduled on the RS-485 task — a
        module cannot keep up with a long map inside one frame (entries vanish and it goes
        deaf for seconds). That needs the module's current id: the optional `id`, else the
        registry's id for that serial; only if neither is known does the map go inline, the
        old way. The call returns at once; wait `settleMs` before re-provisioning the module
        or reading it back. Module ID is always preserved; all other calibration fields and
        the flap position map are overwritten. Map entries not present are cleared.
        The optional `flapCount`/`charSet` (firmware v31+) restore the configurable
        flap set so a backup round-trips; omit them to leave the module's flap set
        unchanged. `charSet` is UTF-8 (any Windows-1252 character — ASCII plus € and
        Western-European accents) and at most 64 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sn, homeOffset, totalSteps]
              properties:
                sn:          { type: string, example: "AABBCCDD11223344" }
                homeOffset:  { type: integer, example: 42 }
                totalSteps:  { type: integer, example: 4096 }
                map:
                  type: string
                  description: Comma-separated `idx=steps` pairs
                  example: "0=210,1=320,2=430"
                flapCount:   { type: integer, minimum: 1, maximum: 64, description: "Active flap count (firmware v31+); omit to leave unchanged." }
                charSet:     { type: string, maxLength: 64, description: "Ordered character set (firmware v31+), UTF-8; any Windows-1252 char (ASCII + € + accents). Omit to leave unchanged." }
                id:          { type: integer, minimum: 0, maximum: 254, description: "The module's CURRENT id, for the per-entry map frames (v3.12). Omit to use the registry's id for this serial." }
      responses:
        "200":
          description: Accepted. The mXW was sent; the map entries are scheduled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:       { type: boolean, example: true }
                  entries:  { type: integer, description: "Map entries in the request", example: 42 }
                  perEntry: { type: boolean, description: "true if the entries were scheduled one per frame; false if the map went inline (no id known, or the TX queue was full)", example: true }
                  id:       { type: integer, description: "The id the entry frames were addressed to (-1 if none known)", example: 11 }
                  settleMs: { type: integer, description: "Milliseconds until the last entry has been sent and the module has settled; wait this long before re-provisioning or reading back", example: 5960 }
        "400":
          $ref: "#/components/responses/BadRequest"

  # ── Status / Config ──────────────────────────────────────────────

  /api/capabilities:
    get:
      tags: [Status]
      summary: What this wall can actually show
      description: |
        One call, made once when a client connects, that answers "what characters can this
        display show?" without the client having to know which gateway it is talking to. The
        Split-Flap Gateway and the Matrix Portal Gateway answer this URL with the SAME shape.

        `charset.union` is every character SOME module can show ("can this wall show a Z
        anywhere?"). `charset.common` is every character EVERY module can show ("can I lay this
        text across arbitrary cells?"). On a real wall these can differ: if module 1 carries A-Z
        and module 2 carries 0-9, the union is A-Z0-9 and the common set is EMPTY -- the wall
        cannot show "HI42" wherever it likes, and only `common` says so. `uniform` is true when
        every module carries the same reel, which is always the case on the Matrix Portal (one
        drawn reel, rendered per cell).

        `sets` reports each DISTINCT reel once, with the ids that carry it ("0-44,50"), rather
        than one entry per module -- so a uniform wall is a few hundred bytes however large it
        is. The `chars` of a set is the reel VERBATIM, in flap-index order, because a client
        addressing a flap by index needs the positions rather than the alphabet.

        THREE TRANSLATIONS apply to the character sets, matching what the gateway does when it
        resolves a frame: the seven colour flaps (r o y g b p w) are reported under `colors` by
        name and kept OUT of the character sets; 'q' -- which the classic reel borrows for the
        double-quote flap -- is reported as '"'; and the six SYMBOL flaps (v4.1), carried on the
        wire as h u d s l t, are reported as the symbols themselves (♥ ↑ ↓ ☺ ← →). The letters
        never appear in `union` or `common`.

        `pictographs` (v4.1) names the symbols SOME reel carries, the way `colors` does for the
        colour flaps, using the companion's own pictograph names. `spelling` (v4.1) gives, for
        every character whose byte on the WIRE differs from the character itself, the byte to
        send on the raw paths (`POST /api/rs485/send`, MQTT `<prefix>/send`): the six symbols
        always, plus `"` -> `q` when the wall's reels borrow that byte and none prints '"'
        itself. The `symbols` feature token means all three of these are present.

        `sets[].chars` is unaffected by any of this: a reel is reported exactly as the module
        stores it, symbol letters and colour codes included, because that is what flap INDEX
        addressing works against.

        On the Split-Flap Gateway a module only reports its reel from firmware v31. `assumed`
        lists modules too old to report one, whose reel is taken to be the firmware's built-in
        default; `unknown` lists modules whose reel is genuinely not known yet (the background
        fill has not reached them, or they are off the bus) and which are excluded from both
        character sets. Both are empty on the Matrix Portal.
      responses:
        "200":
          description: Wall capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  product:  { type: string, example: "Split-Flap Gateway" }
                  fw:       { type: string, example: "3.7.0" }
                  api:      { type: string, example: "3.2.0" }
                  grid:
                    type: object
                    properties:
                      rows: { type: integer, example: 3 }
                      cols: { type: integer, example: 15 }
                  modules:  { type: integer, description: "Provisioned modules on the wall", example: 45 }
                  maxFlaps: { type: integer, description: "Flaps a module can carry (64 real, 237 drawn)", example: 64 }
                  colors:
                    type: array
                    description: "The colour flaps the wall actually has, by name. A custom reel with no colour codes reports none."
                    items: { type: string }
                    example: ["red","orange","yellow","green","blue","purple","white"]
                  pictographs:
                    type: array
                    description: "(v4.1) The symbol flaps SOME reel carries, by name, in table order. Empty on a wall with none."
                    items: { type: string, enum: [heart, up, down, smiley, left, right] }
                    example: ["heart","up","down"]
                  spelling:
                    type: object
                    description: >
                      (v4.1) For each character whose byte on the wire differs from the character
                      itself, the byte to send on the raw frame paths. Always the six symbols;
                      plus '"' -> 'q' when the wall's known reels borrow that byte and none
                      prints '"' directly.
                    additionalProperties: { type: string }
                    example: { "♥": "h", "↑": "u", "↓": "d", "☺": "s", "←": "l", "→": "t", "\"": "q" }
                  charset:
                    type: object
                    properties:
                      union:   { type: string, description: "Every character SOME module can show" }
                      common:  { type: string, description: "Every character EVERY module can show" }
                      uniform: { type: boolean, description: "true when every module carries the same reel" }
                      assumed:
                        type: array
                        description: "Module ids whose reel is the firmware default, assumed rather than reported (fw < 31)"
                        items: { type: integer }
                      unknown:
                        type: array
                        description: "Module ids whose reel is not known; excluded from union and common"
                        items: { type: integer }
                  sets:
                    type: array
                    description: "Each distinct reel once, with the ids that carry it"
                    items:
                      type: object
                      properties:
                        flaps:   { type: integer, example: 64 }
                        source:  { type: string, enum: [reported, assumed, builtin] }
                        chars:   { type: string, description: "The reel verbatim, in flap-index order" }
                        modules: { type: string, description: "Compressed id list", example: "0-44,50" }
                  features:
                    type: array
                    items: { type: string }
                    example: ["colors","index","batch","quiet","maintenance","ha","ota","flapconfig","symbols"]

  /api/status:
    get:
      tags: [Status]
      summary: System status
      responses:
        "200":
          description: Current system status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"

  /api/mqtt/test:
    post:
      tags: [Status]
      summary: Test MQTT broker connectivity and credentials
      description: |
        Performs a TCP reachability check (3s cap) followed by a real MQTT
        CONNECT/CONNACK exchange using a throwaway client, without touching the
        gateway's live MQTT connection. Body fields are optional; omitted fields
        default to the saved configuration, so settings can be verified before
        saving.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                host: { type: string, example: "192.168.1.65" }
                port: { type: integer, example: 1883 }
                user: { type: string }
                pass: { type: string }
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:     { type: boolean, description: "true if MQTT CONNECT succeeded" }
                  tcp:    { type: boolean, description: "TCP connection succeeded" }
                  mqtt:   { type: boolean, description: "MQTT CONNECT/CONNACK succeeded" }
                  state:  { type: integer, description: "PubSubClient state code" }
                  detail: { type: string,  example: "bad username or password" }

  /api/maintenance:
    get:
      tags: [Status]
      summary: Get maintenance-mode state
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  on: { type: boolean, example: false }
    post:
      tags: [Status]
      summary: Enable or disable maintenance mode
      description: |
        A manual hold on the bus with no expiry (v3.15; see `/api/bus`). While it is on, display
        content is paused: MQTT display commands are dropped, and the display endpoints
        (`/api/flap/char|index|text|home`, `/api/rs485/send|batch`, `/api/display/cells`, quiet ON)
        answer `503` to any caller that does not send `X-SF-Client: dashboard`. Maintenance
        operations themselves -- provisioning, calibration, dumps, self-tests -- keep working.
        Since v3.15 those operations take the same hold **automatically** for their own duration,
        so this switch is for a long session no single operation covers. Resets to off on reboot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on: { type: boolean }
            example: { on: true }
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  on: { type: boolean, example: true }

  /api/quiet:
    get:
      tags: [Status]
      summary: Get quiet-time state
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  on: { type: boolean, example: false }
    post:
      tags: [Status]
      summary: Enable or disable quiet time
      description: |
        **Enabling blanks the display.** Every reel is homed to its blank flap as quiet
        time is entered -- the same operation as Home All -- so the wall goes empty for
        the duration.

        While enabled, the gateway still accepts and acknowledges every command, but does
        not transmit normal display-motion frames (show character, show index, home), so
        the flaps then stay still. Deliberate calibration moves (calibrate, goto, nudge)
        are still allowed. Display tracking is left unchanged.

        **Disabling restores the display.** The reels resync to whatever each module was
        last asked to show while quiet -- or, if nothing was asked, to what it was showing
        when quiet time began.

        Always resets to off on reboot (not persisted). Also settable over MQTT
        (`<prefix>/quiet/set`) and from Home Assistant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on: { type: boolean }
            example: { on: true }
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  on: { type: boolean, example: true }

  /api/quiet/schedule:
    get:
      tags: [Status]
      summary: Get the daily quiet-time schedule (v3.0)
      responses:
        "200":
          description: Current schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuietSchedule" }
    post:
      tags: [Status]
      summary: Set the daily quiet-time schedule (v3.0)
      description: |
        When enabled, quiet time is toggled automatically as local time crosses
        the window (overnight windows supported). Transition-based, so a manual
        toggle within a window is respected until the next boundary. Persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuietSchedule" }
            example: { enabled: true, start: "22:00", end: "07:00", days: 127 }
      responses:
        "200":
          description: New schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuietSchedule" }

  # ── Dashboard ───────────────────────────────────────────────────

  /lang/{code}:
    get:
      tags: [UI]
      summary: Fetch a UI translation dictionary (v3.5)
      description: |
        Returns the dashboard's translation dictionary for one language, as a JSON object
        whose **keys are the English UI strings** and whose values are the translations.

        The dashboard fetches exactly one of these, chosen (highest priority first) from
        `?lang=` in its own URL, the user's Settings override, or `navigator.languages`.
        **English is never fetched** — it is the text already in the page, and it is also
        the per-key fallback, so a dictionary may legitimately be partial (the `en-GB` one
        is 7 entries, because only 7 strings differ).

        The body is served with `Content-Encoding: gzip`, which is correct here and is
        exactly what `/api/companion/settings` must NOT send: this gzip is a transfer
        encoding of JSON that the client transparently inflates, whereas the companion
        blob's gzip *is* the payload.

        One route is registered per shipped language, so an unknown code simply 404s.
        Every language ships in the one firmware image; there is no per-language build.
      parameters:
        - name: code
          in: path
          required: true
          description: >
            A shipped language code, e.g. `fr`, `de`, `pt-BR`, `en-GB`. Codes are matched
            exactly, then by base language (`fr-CA` → `fr`). `en` is not a valid value —
            English needs no dictionary.
          schema: { type: string, example: "fr" }
      responses:
        "200":
          description: The dictionary (gzipped JSON; the client inflates it transparently)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
                example: { "Save": "Enregistrer", "Home All": "Tout mettre à l'origine" }
        "304":
          description: Not modified (dictionaries change only on reflash)
        "404":
          description: No such language in this firmware

  # ── Companion app ───────────────────────────────────────────────

  # ── Restore on boot (v3.12) ──────────────────────────────────────

  /api/restore:
    get:
      tags: [Restore]
      summary: Restore-on-boot setting, stored backup, and run progress
      description: |
        Everything the Settings tab's **Restore on Boot** card shows: whether the replay is
        enabled and its post-boot delay, what backup is stored on the gateway, and the state
        and counters of the current or most recent run. While `busy` is true every endpoint
        that would touch the RS-485 bus answers `503 {"error":"restore in progress"}` and
        MQTT commands are dropped. The setting itself is changed through
        `POST /api/config/settings` (`restoreOnBoot`, `restoreDelay`).
      responses:
        "200":
          description: Restore-on-boot status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreStatus" }

  /api/restore/backup:
    put:
      tags: [Restore]
      summary: Store a calibration backup on the gateway
      description: |
        The body is a backup JSON file — the file **Backup Calibration** downloads
        (`{"version":1,"created":"…","modules":[{"sn","id","dump","flapCount","flapChars"}]}`).
        It streams to a temp file and is **parsed before it is accepted**: it must be valid
        JSON with a `modules` array holding at least one usable entry (a serial number and a
        `dump` of the form `<homeOffset>:<totalSteps>:<map>`). Only then is it renamed over
        the live copy, so a bad upload never replaces a good backup. At most 256 KB.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "A calibration backup file" }
      responses:
        "200":
          description: Stored; the body is the new restore status (with the file summary)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreStatus" }
        "400":
          description: Empty or truncated body — nothing was changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A restore is running — nothing was changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Larger than 256 KB — nothing was changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Not a usable backup (the `error` says why) — nothing was changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No filesystem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Restore]
      summary: Delete the stored backup
      description: |
        Removes the stored backup. The enable flag is left as it is: an enabled restore with
        nothing stored is logged and skipped at boot, without locking the bus.
      responses:
        "200":
          description: Deleted; the body is the new restore status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreStatus" }
        "409":
          description: A restore is running — nothing was changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/restore/run:
    post:
      tags: [Restore]
      summary: Replay the stored backup now
      description: |
        Starts a run exactly like the one at boot, without rebooting: the bus locks at
        once, the run starts after `delay` seconds (default 0), writes and verifies every
        module, homes the wall, and unlocks. `409` if a run is already in progress, `404`
        if no usable backup is stored.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                delay: { type: integer, minimum: 0, maximum: 600, example: 0, description: "Seconds to wait before the first frame" }
      responses:
        "200":
          description: Started; the body is the restore status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreStatus" }
        "404":
          description: No usable backup is stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A restore is already running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/restore/cancel:
    post:
      tags: [Restore]
      summary: Cancel a running restore
      description: Stops the run after its current step and releases the bus. `409` if none is running.
      responses:
        "200":
          description: Cancel requested; the body is the restore status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreStatus" }
        "409":
          description: No restore is running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── Bus hold & diagnostics (v3.14 / v3.15) ─────────────────────────

  /api/bus:
    get:
      tags: [Status]
      summary: Who holds the bus, and how hard
      description: |
        Every maintenance operation -- provisioning, calibration, self-tests, the probe and
        soak, a backup sweep, a restore -- takes a hold on the bus automatically. While any
        BUSY hold is in force, external display content is paused (the display endpoints answer
        503 to callers without `X-SF-Client: dashboard`; MQTT display commands are dropped);
        an EXCLUSIVE hold (a restore) refuses every bus route. Each hold has a reason and a
        lease and expires on its own; only the manual Maintenance switch has no expiry.
      responses:
        "200":
          description: The holds in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusHolds" }

  /api/bus/hold:
    post:
      tags: [Status]
      summary: Take or renew a BUSY lease on the bus
      description: |
        For a client that runs a multi-step maintenance job of its own (the dashboard holds one
        during a backup sweep and while its Calibration tab is open). The same reason renews in
        place; a lease is capped at 300 s so a client must keep renewing -- nothing is held
        forever by accident. Reasons the firmware owns (`restore`, `maintenance`, `probe`,
        `soak`, `diagnostics`, `identify`) are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:  { type: string, maxLength: 19, example: "backup" }
                seconds: { type: integer, minimum: 5, maximum: 300, default: 30, example: 60 }
      responses:
        "200":
          description: The holds in force after this one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusHolds" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/bus/incidents:
    get:
      tags: [Status]
      summary: What the bus got wrong, newest first (v3.16)
      description: |
        A short history of bus anomalies with the module each belongs to, kept in PSRAM (1024
        entries) until the gateway restarts. Counters say how many frames were discarded; this
        says which module had the bus, what it was being asked and how big the frame was.
        Streamed.
      parameters:
        - name: max
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 300 }
      responses:
        "200":
          description: The newest incidents
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:    { type: boolean }
                  total: { type: integer, description: "Recorded since boot, including those since overwritten" }
                  held:  { type: integer, description: "Still in the ring" }
                  shown: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        ms:    { type: integer, description: "millis() at capture" }
                        ep:    { type: integer, description: "UTC epoch, 0 if the clock was not set" }
                        id:    { type: integer, nullable: true, description: "Module it belongs to; null when it could not be attributed" }
                        kind:
                          type: string
                          enum: [D, R, L, M, X]
                          description: >
                            D a frame was discarded (too long, or never terminated);
                            R a frame arrived complete and would not parse;
                            L a long read answered only when asked a second time;
                            M a long read was never answered;
                            C a checksummed frame arrived and its checksum did not match;
                            F a long read failed and a shorter one succeeded in its place
                              -- the module is there, its reply LENGTH is the problem;
                            X two modules appear to share one id
                        cmd:   { type: string, description: "The command in flight (v, Q, d, A, W)" }
                        bytes: { type: integer, description: "Size involved, when known" }
    delete:
      tags: [Status]
      summary: Clear the incident log (v3.16)
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/bus/release:
    post:
      tags: [Status]
      summary: Release a lease taken with /api/bus/hold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, example: "backup" }
                force:
                  type: boolean
                  default: false
                  description: >
                    Release a hold the FIRMWARE owns -- the way out when something has left the
                    wall paused (v3.15.1). Forcing the soak's hold cancels the soak itself; a
                    restore can never be forced, it has its own cancel endpoint.
      responses:
        "200":
          description: The holds remaining
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusHolds" }

  /api/flap/probe:
    post:
      tags: [Status]
      summary: Reply-size probe for one module (v3.14)
      description: |
        Asks the module for four replies of increasing size -- `v` (~32 B), `Q` (~19 B), `d`
        (the EEPROM dump) and `A` (the combined dump, the longest reply a module sends) --
        `rounds` times each, and records which came back and how big they were. Short replies
        answering while long ones fail points at the bus (termination, length) rather than the
        module. Runs on its own task; poll `/api/flap/probe/status`. Holds the bus (BUSY) for
        the run, and refuses to start while a self-test, calibration or soak owns it (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:     { type: integer, minimum: 0, maximum: 254 }
                rounds: { type: integer, minimum: 1, maximum: 10, default: 3 }
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean, example: true }
                  started: { type: boolean, example: true }
                  id:      { type: integer, example: 11 }
        "409":
          description: Something else owns the bus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/flap/probe/status:
    get:
      tags: [Status]
      summary: Progress and result of the reply-size probe
      responses:
        "200":
          description: Running progress, or the finished result
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:   { type: string, enum: [idle, running, done] }
                  id:      { type: integer }
                  step:    { type: integer, description: "Steps completed" }
                  total:   { type: integer, description: "rounds x 4" }
                  elapsed: { type: integer, description: "ms" }
                  drops:   { type: integer, description: "Frames discarded during the probe" }
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        cmd:   { type: string, enum: [v, Q, d, A] }
                        tries: { type: integer }
                        ok:    { type: integer }
                        bytes: { type: integer, description: "Longest reply seen for this step; 0 = never answered" }

  /api/flap/soak:
    post:
      tags: [Status]
      summary: Whole-wall soak test (v3.15)
      description: |
        Works the bus seven ways for `minutes`, one kind per pass, keeping a tally per module
        per kind: a **broadcast roll call** (`m*v<lo>-<hi>`, scoring a reply that is missing,
        damaged, or arrives twice for one id), the four single-module replies of increasing
        size (`v`, `Q`, `d`, `A`), a **broadcast combined dump** (`m*A<lo>-<hi>`, the longest
        replies back to back), and a **write round trip** (the module's home offset and one
        calibrated map entry, each nudged by one half-step, read back, put back, and read back
        again). Discarded and corrupt frames are counted over the run. Nothing it sends moves a
        flap. Holds the bus (BUSY) for the run so content cannot interleave; stops at the
        deadline or on cancel, never in the middle of a write round trip. Refuses to start (409)
        while a probe, self-test or calibration owns the bus. The dashboard offers 5/10/20/30
        minutes; the API takes 1-60.

        Before the first write it reads every provisioned module's calibration into a snapshot
        file on the gateway (progress in `snap` on the status reply), so the run can be undone
        with `/api/flap/soak/rollback`. The snapshot is separate from the stored restore backup
        and never overwrites it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                minutes: { type: integer, minimum: 1, maximum: 60, default: 10 }
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean, example: true }
                  started: { type: boolean, example: true }
                  modules: { type: integer, example: 15 }
                  minutes: { type: integer, example: 10 }
        "409":
          description: Something else owns the bus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/modules/firmware:
    get:
      tags: [Status]
      summary: The stored module-firmware image (v4.0)
      description: |
        What is stored for updating the MODULES' own firmware over the bus, plus the state of
        any run in progress. The same body `/status` returns.
      responses:
        "200":
          description: Image and run state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModFwStatus" }
    put:
      tags: [Status]
      summary: Store a module-firmware image (v4.0)
      description: |
        The body is `firmware-update.bin` from a module firmware release: exactly 15,360 bytes,
        240 pages of 64. The gateway checks the image's own CRC (its last two bytes, big-endian,
        over everything before them) and refuses anything that does not match, so a truncated
        upload cannot be sent to a wall.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200": { description: Stored, content: { application/json: { schema: { $ref: "#/components/schemas/ModFwStatus" } } } }
        "400": { description: Not 15,360 bytes }
        "409": { description: An update is running }
        "422": { description: The image's CRC does not check out }
    delete:
      tags: [Status]
      summary: Forget the stored image (v4.0)
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/modules/firmware/start:
    post:
      tags: [Status]
      summary: Update the modules' firmware over the bus (v4.0)
      description: |
        Runs the procedure in the module firmware's BUS-UPDATE.md: into update mode with a
        checksummed command, confirm, broadcast the 240 pages once for every module at a time,
        ask each module which pages it actually wrote, resend only the gaps, then go. Modules
        older than v35 have no bootloader and are skipped. The bus is held EXCLUSIVELY for the
        run, which takes about 75 seconds however many modules are being updated.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer, minimum: 0, maximum: 254 }
                  description: Modules to update. Omit, or send {}, for every eligible module.
      responses:
        "200": { description: Started, content: { application/json: { schema: { $ref: "#/components/schemas/ModFwStatus" } } } }
        "409": { description: No image, nothing eligible, or the bus is busy }

  /api/modules/firmware/status:
    get:
      tags: [Status]
      summary: Progress of a module firmware update (v4.0)
      responses:
        "200": { description: Progress, content: { application/json: { schema: { $ref: "#/components/schemas/ModFwStatus" } } } }

  /api/modules/firmware/cancel:
    post:
      tags: [Status]
      summary: Stop an update after the current frame (v4.0)
      description: >
        A module that has not been told to start an image stays in its bootloader waiting for
        one; run the update again, or send it back to its existing firmware.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "409": { description: No update running }

  /api/modules/firmware/probe:
    post:
      tags: [Status]
      summary: Ask one module's bootloader how it is doing (v4.0)
      description: >
        A module running its firmware does not answer, which is itself the answer. One in
        update mode reports the bootloader version, why it is there, which image it holds and
        how many of its 240 pages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer, minimum: 0, maximum: 254 }
      responses:
        "200":
          description: What the module said, or that it said nothing
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:           { type: boolean }
                  id:           { type: integer }
                  inBootloader: { type: boolean }
                  bootloader:   { type: integer, description: "Bootloader version" }
                  reason:       { type: integer, description: "1 it was asked to, 2 it has no valid firmware" }
                  flags:        { type: integer, description: "Bit 0: the last go did not start an image" }
                  imageCrc:     { type: string, description: "The image it is receiving; FFFF = none" }
                  pagesHeld:    { type: integer }
                  pagesNeeded:  { type: integer, example: 240 }
                  note:         { type: string }

  /api/flap/stats:
    post:
      tags: [Status]
      summary: A module's own snapshot, without starting a self-test (v3.18)
      description: |
        The same figures as `/api/flap/diag` returns, but it does not start a Hall test with
        them, so nothing moves. Since module firmware v33 the snapshot carries the counters that
        matter for chasing a bus problem: receive overflows, broadcast replies sent and how many
        went out late, and checksummed frames the module dropped as corrupt. Comparing
        `bcastSent` with what the gateway heard separates a reply lost on the wire from one that
        was never sent. Older firmware reports the four as -1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer, minimum: 0, maximum: 254 }
      responses:
        "200":
          description: The snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:          { type: boolean }
                  id:          { type: integer }
                  resetCause:  { type: integer }
                  bootCount:   { type: integer }
                  vcc:         { type: integer, description: "Supply in millivolts" }
                  eepromOk:    { type: integer }
                  curIndex:    { type: integer }
                  rxOverflows: { type: integer }
                  bcastSent:   { type: integer }
                  bcastLate:   { type: integer }
                  crcErrors:   { type: integer }
        "504":
          description: The module did not answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/flap/soak/log:
    get:
      tags: [Status]
      summary: The raw bus traffic of the last soak test (v3.17)
      description: |
        Every frame the last soak put on the wire, as a text file: a header with the gateway
        version, the bus settings and every module with its firmware and serial number, then
        one line per frame (milliseconds since the start, direction, the frame itself). Kept
        after every run, clean or not, and replaced by the next one; it survives a reboot.

        Frames are recorded whole, including a full combined dump with its calibration map, and
        coverage is complete: every frame the gateway's counters see is in the file. The capture
        is held in PSRAM during the run and written to flash only once the bus is released, so
        it cannot perturb what it measures. The ring is 4 MB and evicts whole lines from the
        front, noting in the file how many were dropped -- about 2 KB per module-minute, so a
        64-module half-hour run (~3.6 MB) fits whole.
      parameters:
        - name: meta
          in: query
          required: false
          schema: { type: string }
          description: Any value returns what is stored instead of the file.
      responses:
        "200":
          description: The trace, or its metadata with `?meta=1`
          content:
            text/plain:
              schema: { type: string }
            application/json:
              schema:
                type: object
                properties:
                  ok:     { type: boolean }
                  exists: { type: boolean }
                  bytes:  { type: integer }
                  header: { type: string, description: "The first line of the stored trace" }
        "404":
          description: No trace stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/flap/soak/snapshot:
    get:
      tags: [Status]
      summary: The calibration the soak test read before it wrote anything (v3.15)
      description: |
        The pre-run snapshot, in the same format as a calibration backup, so it can be kept or
        replayed later through the ordinary restore upload. With `?meta=1` it returns only what
        is in the file. Separate from the stored restore backup.
      parameters:
        - name: meta
          in: query
          required: false
          schema: { type: string }
          description: Any value returns the summary instead of the file.
      responses:
        "200":
          description: The snapshot file, or its summary with `?meta=1`
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  exists:  { type: boolean }
                  bytes:   { type: integer }
                  modules: { type: integer, description: "Usable entries" }
                  entries: { type: integer }
                  created: { type: string }
        "404":
          description: No snapshot stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/flap/soak/rollback:
    post:
      tags: [Status]
      summary: Put every module back to the pre-soak snapshot (v3.15)
      description: |
        Replays the snapshot through the same per-entry restore the boot restore uses: writes
        each module's calibration by serial number, reads it back, compares, and homes the wall.
        Takes the EXCLUSIVE bus hold for its duration; follow it on `/api/restore`. For the case
        the soak report calls out: a value it wrote that could not be confirmed put back.
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean, example: true }
                  started: { type: boolean, example: true }
                  source:  { type: string, example: "soak snapshot" }
        "409":
          description: The soak is still running, a restore is already running, or there is no usable snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/flap/soak/cancel:
    post:
      tags: [Status]
      summary: Stop the soak test after its current query
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "409":
          description: No soak test running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/flap/soak/status:
    get:
      tags: [Status]
      summary: Progress and per-module tally of the soak test
      description: |
        Streamed; the `rows` array has one entry per provisioned module. Each kind of traffic is
        a `[ok, tries]` pair: `v`/`Q`/`d`/`A` the single-module replies, `V` the broadcast roll
        call, `B` the broadcast combined dump, `W` the write round trip.
      responses:
        "200":
          description: Running progress, or the finished result
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:     { type: string, enum: [idle, running, done, cancelled] }
                  modules:   { type: integer }
                  passes:    { type: integer }
                  queries:   { type: integer }
                  failures:  { type: integer }
                  elapsed:   { type: integer, description: "ms" }
                  remaining: { type: integer, description: "seconds, while running" }
                  drops:     { type: integer, description: "Frames discarded during the run" }
                  rejects:   { type: integer, description: "Frames that arrived corrupt during the run" }
                  writes:      { type: integer, description: "Write round trips run" }
                  restoreFail: { type: integer, description: "Written values that could NOT be confirmed put back (see rows[].alt)" }
                  dups:        { type: integer, description: "Broadcast replies beyond the first from one id" }
                  snap:
                    type: object
                    description: "The pre-run safety snapshot (v3.15)"
                    properties:
                      running: { type: boolean, description: "The snapshot sweep is in progress; the test itself has not begun" }
                      ok:      { type: boolean, description: "A usable snapshot exists for this run" }
                      done:    { type: integer, description: "Modules swept" }
                      total:   { type: integer, description: "Modules to sweep" }
                      modules: { type: integer, description: "Modules actually captured" }
                      err:     { type: string,  description: "Why no snapshot was taken, when ok is false" }
                  stray:       { type: integer, description: "Broadcast replies from ids not in the module table" }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        id:     { type: integer }
                        v:      { type: array, items: { type: integer }, description: "[ok, tries] -- version" }
                        Q:      { type: array, items: { type: integer }, description: "[ok, tries] -- stats snapshot" }
                        d:      { type: array, items: { type: integer }, description: "[ok, tries] -- EEPROM dump" }
                        A:      { type: array, items: { type: integer }, description: "[ok, tries] -- combined dump" }
                        V:      { type: array, items: { type: integer }, description: "[ok, tries] -- broadcast roll call" }
                        B:      { type: array, items: { type: integer }, description: "[ok, tries] -- broadcast combined dump" }
                        W:      { type: array, items: { type: integer }, description: "[ok, tries] -- write round trip" }
                        max:    { type: integer, description: "Longest reply seen from this module" }
                        streak: { type: integer, description: "Consecutive misses right now" }
                        worst:  { type: integer, description: "Longest run of consecutive misses" }
                        alt:    { type: integer, description: "Written and NOT confirmed put back: bit0 home offset, bit1 map entry. With `orig`, the values found before the first write" }
                        bad:    { type: integer, description: "Broadcast replies from this id that arrived but did not parse whole" }
                        dup:    { type: integer, description: "Broadcasts in which this id answered more than once -- two modules share it" }
                        ww:     { type: integer, description: "Why the write leg failed: bit0 a write did not read back, bit1 it could not be put back" }
                        fw:     { type: integer, description: "The module's firmware version as a number (v3.15.2)" }
                        late:   { type: integer, description: "Long reads that only answered when asked a second time (v3.15.2). Zero on a healthy bus; a climbing count means module receivers are overflowing" }
                        drops:  { type: integer, description: "Frames the gateway discarded while THIS module had the bus (v3.15.2) -- the difference between a module that said nothing and one whose reply did not survive the trip" }
                        orig:
                          type: object
                          description: "Present when alt is set: the home offset, map index and position this module had before the test wrote to it"
                          properties:
                            ho:  { type: integer }
                            idx: { type: integer }
                            pos: { type: integer }

  /api/companion:
    get:
      tags: [Companion]
      summary: Get the registered companion app (v3.0)
      responses:
        "200":
          description: Registered companion URL and its last reported status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Companion" }
    post:
      tags: [Companion]
      summary: Register the companion app and heartbeat its status (v3.0)
      description: |
        The companion app posts its own URL here so the gateway can show
        **Companion** tabs linking back to it. The URL is persisted in NVS (and
        only rewritten when it actually changes, to spare the flash from
        heartbeats); the status is runtime-only and clears on reboot.

        An empty `url` deregisters the companion. Either field may be sent alone.

        **v3.4 — tab advertisement.** The companion may also send `tabs`: the deep
        links its own UI has. The dashboard then links exactly those, instead of a
        list hard-coded in this firmware that goes stale whenever the companion gains
        or loses a tab. The response always carries `gwTabs`, this gateway's own tabs,
        for the same reason in the other direction.

        Both halves are optional and independent, so every pairing works: an older
        companion sends no `tabs` (the dashboard falls back to its built-in list), and
        an older gateway sends no `gwTabs` (the companion falls back to its own). A
        `tabs` list is only stored while a companion is registered — a deregister
        clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Companion" }
            example:
              url: "http://192.168.1.60:8000"
              status: "Running: Weather"
              tabs:
                - { id: "apps", label: "Apps" }
                - { id: "compose", label: "Compose" }
                - { id: "playlists", label: "Playlists" }
                - { id: "triggers", label: "Triggers" }
      responses:
        "200":
          description: The stored registration after the update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Companion" }

  /api/companion/settings:
    get:
      tags: [Companion]
      summary: Fetch the companion's stored settings blob (v3.1)
      description: |
        Returns the blob exactly as it was stored by `PUT`, byte for byte.

        The body is `gzip(minified JSON)` whose schema belongs entirely to the
        companion — the gateway never parses it. It is served as
        `application/gzip` and **not** with `Content-Encoding: gzip`: these bytes
        are the payload, not a transfer encoding of it, so HTTP clients must not
        transparently decompress them. The caller decompresses it itself.
      responses:
        "200":
          description: The stored gzipped JSON blob
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "404":
          description: Nothing stored yet (or the filesystem is unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [Companion]
      summary: Store the companion's settings blob (v3.1)
      description: |
        Stores the request body **verbatim** and **atomically**: it streams to a
        temp file on the FATFS partition and is renamed over the live copy only
        once the final byte lands, so an interrupted upload can never corrupt
        settings that were already good. The blob survives OTA firmware updates.

        The body must be `gzip(minified JSON)`, at most 64 KB (real blobs are
        1–2 KB). The gateway stores whatever bytes it is given and does not
        validate that they are valid gzip or valid JSON.
      requestBody:
        required: true
        content:
          application/gzip:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:    { type: boolean, example: true }
                  bytes: { type: integer, description: "Bytes stored", example: 1284 }
        "400":
          description: Empty or truncated body — nothing was changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Blob larger than 64 KB — nothing was changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Filesystem not mounted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "507":
          description: Write failed (storage full or I/O error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/config:
    get:
      tags: [Config]
      summary: Get current configuration (passwords excluded)
      responses:
        "200":
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"

  /api/config/wifi:
    post:
      tags: [Config]
      summary: Save WiFi credentials and reconnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ssid, pass]
              properties:
                ssid: { type: string, example: "MyNetwork" }
                pass: { type: string, example: "mypassword" }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/config/mqtt:
    post:
      tags: [Config]
      summary: Save MQTT broker settings and reconnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, port, prefix]
              properties:
                host:   { type: string, example: "192.168.1.50" }
                port:   { type: integer, default: 1883 }
                user:   { type: string, example: "" }
                pass:   { type: string, example: "" }
                prefix: { type: string, default: "splitflap" }
            example: { host: "192.168.1.50", port: 1883, user: "", pass: "", prefix: "splitflap" }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/config/rs485:
    post:
      tags: [Config]
      summary: Save RS-485 bus settings
      description: Updates the serial bus parameters. Takes effect on the next bus reinitialisation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baud:     { type: integer, default: 9600, example: 9600 }
                dataBits: { type: integer, default: 8, example: 8 }
                parity:   { type: integer, description: "0=None 1=Even 2=Odd", default: 0, example: 0 }
                stopBits: { type: integer, default: 1, example: 1 }
            example: { baud: 9600, dataBits: 8, parity: 0, stopBits: 1 }
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/config/settings:
    post:
      tags: [Config]
      summary: Save timezone, serial debug, or OTA password
      description: Send only the fields you want to change. Each takes effect immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                posixTZ:     { type: string, example: "EST5EDT,M3.2.0,M11.1.0" }
                ntpServer:   { type: string, example: "pool.ntp.org", description: "NTP server hostname; blank resets to pool.ntp.org" }
                gridRows:    { type: integer, minimum: 1, maximum: 64, example: 1,  description: "Display wall rows" }
                gridCols:    { type: integer, minimum: 1, maximum: 64, example: 16, description: "Display wall columns" }
                serialDebug: { type: boolean, example: true }
                haEnabled:   { type: boolean, example: true, description: "Enable Home Assistant MQTT auto-discovery and entity state topics" }
                otaPassword: { type: string, example: "mysecret" }
                restoreOnBoot: { type: boolean, example: true, description: "Replay the stored calibration backup on every boot (v3.12). Takes effect at the next boot" }
                restoreDelay:  { type: integer, minimum: 0, maximum: 600, example: 10, description: "Seconds after boot before that replay starts (v3.12)" }
                stepMs:        { type: integer, minimum: 0, maximum: 100, example: 25, description: "Default per-module cascade pacing in ms (v3.13), reported on GET /api/config for clients to use as their step_ms" }
            examples:
              timezone:
                value:
                  posixTZ: "EST5EDT,M3.2.0,M11.1.0"
              ntp_server:
                value:
                  ntpServer: "time.google.com"
              debug_on:
                value:
                  serialDebug: true
              home_assistant:
                value:
                  haEnabled: true
              ota_password:
                value:
                  otaPassword: "mysecret"
              restore_on_boot:
                value:
                  restoreOnBoot: true
                  restoreDelay: 10
              step_pacing:
                value:
                  stepMs: 25
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  # ── OTA ─────────────────────────────────────────────────────────

  /ota:
    get:
      tags: [OTA]
      summary: Browser-based firmware upload page
      description: Returns an HTML page with a file picker for uploading a compiled `.bin` file.
      responses:
        "200":
          description: HTML upload page
          content:
            text/html:
              schema:
                type: string

  /api/ota/upload:
    post:
      tags: [OTA]
      summary: Upload compiled firmware binary
      description: |
        Accepts a raw binary POST body (the compiled `.bin` file).
        The gateway reboots automatically on success.
        Obtain the binary via Arduino IDE **Sketch → Export Compiled Binary**.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Upload successful — gateway rebooting
          content:
            text/plain:
              schema:
                type: string
                example: "OK"
        "500":
          description: Update failed
          content:
            text/plain:
              schema:
                type: string

# ── Reusable components ──────────────────────────────────────────

components:
  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
                example: true
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:    { type: boolean, example: false }
              error: { type: string, example: "id required" }

  schemas:
    Error:
      type: object
      description: The error body sent by a failing endpoint.
      properties:
        error: { type: string, example: "Settings blob too large" }

    Companion:
      type: object
      description: Companion-app registration (v3.0; tab advertisement added in v3.4).
      properties:
        url:
          type: string
          description: "The companion's own base URL. Persisted; blank means no companion is registered. Posting a blank url deregisters it"
          example: "http://192.168.1.60:8000"
        status:
          type: string
          description: "The companion's last reported running status. Runtime-only -- clears on reboot. Quotes, backslashes and control characters are sanitised"
          example: "Running: Weather"
        tabs:
          type: array
          description: >
            The tabs (deep links) the companion's own UI offers, sent on registration
            and re-sent on every heartbeat; the dashboard links exactly these instead of
            a list hard-coded in this firmware. Runtime-only, and cleared on deregister.
            Omitted by a pre-3.4 companion, in which case the dashboard falls back to its
            built-in list. Rejected **whole** -- not partially -- if any entry is
            malformed, an id is not `[A-Za-z0-9_-]{1,24}`, a label exceeds 24 printable
            ASCII characters, there are more than 10 tabs, or the list exceeds 384 bytes;
            a rejected list is treated exactly like an absent one (v3.4)
          items: { $ref: "#/components/schemas/UiTab" }
        gwTabs:
          type: array
          readOnly: true
          description: >
            This firmware's own tabs, so the companion's nav links exactly the tabs this
            gateway has. Always present in a v3.4+ response; a companion that doesn't see
            it is talking to an older gateway and falls back to its built-in list (v3.4)
          items: { $ref: "#/components/schemas/UiTab" }

    UiTab:
      type: object
      description: One tab in a peer's UI, as a deep link (v3.4).
      properties:
        id:
          type: string
          description: "The URL hash the peer's UI routes on -- e.g. `calibration` links to `<base>/#calibration`. Not the internal pane name"
          example: "calibration"
        label:
          type: string
          description: "What the nav shows for it"
          example: "Calibration"

    ModFwStatus:
      type: object
      description: The stored module-firmware image and the state of any update (v4.0).
      properties:
        ok:    { type: boolean }
        state:
          type: string
          enum: [idle, entering, confirming, sending, verifying, going, checking, done, failed, cancelled]
        targets:       { type: integer }
        pass:          { type: integer, description: "Resend round, 1-based" }
        pagesSent:     { type: integer }
        pagesThisPass: { type: integer }
        updated:       { type: integer, description: "Modules now running the new firmware" }
        elapsed:       { type: integer, description: "ms" }
        error:         { type: string }
        image:
          type: object
          properties:
            stored: { type: boolean }
            bytes:  { type: integer, example: 15360 }
            crc:    { type: string, example: "6E1C" }
            valid:  { type: boolean }
            pages:  { type: integer, example: 240 }
        modules:
          type: array
          items:
            type: object
            properties:
              id:           { type: integer }
              from:         { type: integer, description: "The version it ran when the run started" }
              to:           { type: integer, description: "What it reports afterwards; 0 = not back yet" }
              inBootloader: { type: boolean }
              pagesLeft:    { type: integer }

    BusHolds:
      type: object
      description: The bus holds in force (v3.15).
      properties:
        level:     { type: integer, enum: [0, 1, 2], description: "Strongest hold: 0 free, 1 busy, 2 exclusive", example: 1 }
        reason:    { type: string, example: "calibration" }
        remaining: { type: integer, description: "Seconds left on the strongest hold; -1 = no expiry", example: 52 }
        holds:
          type: array
          items:
            type: object
            properties:
              reason:    { type: string, example: "calibration" }
              level:     { type: integer, example: 1 }
              remaining: { type: integer, example: 52 }

    RestoreStatus:
      type: object
      description: Restore-on-boot status (v3.12), as returned by every /api/restore endpoint.
      properties:
        ok:       { type: boolean, example: true }
        enabled:  { type: boolean, description: "Replay on every boot", example: true }
        delay:    { type: integer, description: "Seconds after boot before the replay starts", example: 10 }
        file:
          type: object
          description: The backup stored on the gateway
          properties:
            exists:  { type: boolean, example: true }
            bytes:   { type: integer, example: 43210 }
            modules: { type: integer, description: "Usable entries (serial + parseable dump)", example: 45 }
            entries: { type: integer, description: "All entries in the file", example: 45 }
            version: { type: integer, description: "The backup's own version field", example: 1 }
            created: { type: string, description: "The backup's created field, verbatim", example: "2026-09-01T20:46:28.897Z" }
        state:    { type: string, enum: [idle, waiting, writing, verifying, homing, done, failed, cancelled], example: done }
        busy:     { type: boolean, description: "true while the bus is locked (waiting/writing/verifying/homing)", example: false }
        trigger:  { type: string, enum: ["", boot, manual], description: "What started the current/last run", example: boot }
        total:    { type: integer, description: "Entries in the backup being replayed", example: 45 }
        done:     { type: integer, description: "Entries completed in the current phase", example: 45 }
        okCount:  { type: integer, description: "Read back and matched the backup", example: 44 }
        mismatch: { type: integer, description: "Answered, but still differed after the repair round", example: 0 }
        missing:  { type: integer, description: "Never answered the read-back", example: 1 }
        skipped:  { type: integer, description: "Unusable entries (no serial, or an unparseable dump)", example: 0 }
        startsIn: { type: integer, description: "Seconds until the run starts (waiting state only)", example: 0 }
        elapsed:  { type: integer, description: "Seconds the run has taken so far, or took", example: 71 }
        finishedAgo: { type: integer, description: "Seconds since the run ended; -1 while running or if none ran", example: 3600 }
        lastError: { type: string, description: "Why a run could not start (failed state)", example: "" }

    QuietSchedule:
      type: object
      description: Daily quiet-time schedule (v3.0).
      properties:
        enabled: { type: boolean, example: true }
        start:   { type: string, description: "Window start HH:MM", example: "22:00" }
        end:     { type: string, description: "Window end HH:MM (overnight allowed)", example: "07:00" }
        days:    { type: integer, description: "Active-day bitmask, bit0=Sun … bit6=Sat", example: 127 }
        offset:  { type: integer, description: "Client UTC offset in minutes east of UTC; the window is evaluated in this local time. The web UI sends it on load.", example: -300 }
    BusFrame:
      type: object
      properties:
        ts:      { type: integer, description: "Milliseconds since boot", example: 12345 }
        wt:      { type: string,  description: "Local wall-clock timestamp", example: "2026-06-10 14:32:01" }
        ep:          { type: integer, description: "UTC epoch at capture (0 if RTC not set); UI renders in browser-local time", example: 1781210380 }
        dir:     { type: string,  enum: [R, T], description: "R=received, T=transmitted" }
        command: { type: string,  description: "Frame content (trailing newline stripped)", example: "m5-A" }
        len:     { type: integer, description: "Original byte length including newline", example: 5 }

    Module:
      type: object
      properties:
        id:          { type: integer, description: "Module ID (255 = unprovisioned slot)", example: 5 }
        sn:          { type: string,  description: "Serial number hex string", example: "AABBCCDD11223344" }
        provisioned: { type: boolean, example: true }
        flapIndex:   { type: integer, description: "Last known flap index (-1 = unknown)", example: 1 }
        flapChar:    { type: string,  description: "Last known displayed character -- what the flap SHOWS: a symbol flap as its symbol (v4.1), the double-quote flap as '\"', colour flaps as their letters", example: "A" }
        fwVersion:   { type: string,  description: "Firmware version string (empty for legacy v7-or-earlier modules, which do not answer the version command)", example: "12" }
        lastSeen:    { type: integer, description: "millis() of last activity (0 if not seen since boot; restored entries start at 0)", example: 45000 }
        lastSeenEpoch: { type: integer, description: "RTC wall-clock epoch (seconds) of last activity; survives reboot. 0 if the RTC clock has never been set.", example: 1781210380 }
        acked:       { type: boolean, description: "true once the module acknowledged provisioning (an acked module is, by definition, not legacy)", example: true }
        dupSuspect:  { type: boolean, description: "true if a possible DUPLICATE ID was detected on the bus for this module -- repeated corrupt version/all replies (intact framing, garbled serial), the signature of two modules sharing one ID. Clears on the next clean version read.", example: false }

    SyncReply:
      type: object
      description: Response from a synchronous wait-for-reply endpoint
      properties:
        ok:       { type: boolean }
        id:       { type: integer, description: "Module ID" }
        sn:       { type: string,  description: "Serial number" }
        stale:    { type: boolean, description: "true if data is from cache (module did not respond to this request)" }
        lastSeen: { type: integer, description: "millis() of last module activity" }
        error:    { type: string,  description: "Present only when ok is false" }

    Status:
      type: object
      properties:
        uptime:    { type: integer, description: "Seconds since boot", example: 3842 }
        psram:
          type: object
          description: "On-board PSRAM in bytes (v3.16). The large runtime buffers live here, which is what keeps internal RAM free for WiFi and an OTA upload."
          properties:
            size: { type: integer, example: 8388608 }
            free: { type: integer, example: 7643136 }
        flash:
          type: object
          description: "Firmware image size and the room left in the OTA slot, in bytes (v3.16)"
          properties:
            sketch: { type: integer, example: 1529024 }
            free:   { type: integer, example: 3145728 }
        reset:
          type: string
          description: >
            Why the board last rebooted (v3.15.2): POWERON, SW (a clean restart or an OTA),
            PANIC, INT_WDT, TASK_WDT, WDT, BROWNOUT, DEEPSLEEP or OTHER. PANIC and the
            watchdogs point at firmware; BROWNOUT points at the supply.
          example: "SW"
        rx:        { type: integer, description: "Frames received since boot", example: 124 }
        tx:        { type: integer, description: "Frames transmitted since boot", example: 37 }
        baud:      { type: integer, example: 9600 }
        wifi:      { type: boolean, example: true }
        ip:        { type: string,  example: "192.168.1.105" }
        apip:      { type: string,  example: "192.168.4.1" }
        heap:      { type: integer, description: "Free heap bytes", example: 187432 }
        mqtt:      { type: boolean, example: true }
        modules:   { type: integer, example: 6 }
        time:      { type: string,  description: "Local RTC time", example: "2026-06-10 14:32:01" }
        ntpSynced: { type: boolean, example: true }
        maint:     { type: boolean, description: "true if maintenance mode is on (external MQTT commands ignored)", example: false }
        quiet:     { type: boolean, description: "true if quiet time is on (flaps do not move for display updates)", example: false }
        bus:
          type: object
          description: "Bus health (v3.14) and the bus hold (v3.15)"
          properties:
            rejects:   { type: integer, description: "Frames that arrived complete but would not parse", example: 0 }
            dropped:   { type: integer, description: "Frames discarded: longer than the receive buffer, or never terminated. Used to be silent", example: 0 }
            dropBytes: { type: integer, description: "Size of the most recently discarded frame", example: 0 }
            maxLen:    { type: integer, description: "Longest complete frame received since boot (limit 1024)", example: 447 }
            crcOk:     { type: integer, description: "Checksummed frames verified (v3.18; module firmware v33+)", example: 165 }
            crcFail:   { type: integer, description: "Checksummed frames dropped because the wire corrupted them. Should be zero", example: 0 }
            lock:
              type: object
              description: >
                Who holds the bus (v3.15). level 1 = busy: external display content is refused
                with 503, the dashboard is not; level 2 = exclusive: every bus route is refused.
                Homing is maintenance, not content, so it is allowed at level 1 (v3.15.1).
                While a machine-run test holds the bus (probe, soak, self-tests) content AND
                homing are refused to every caller, measurement being the point of them. A
                caller counts as the operator by the header `X-SF-Client: dashboard` or by being
                the address that took the hold.
              properties:
                level:     { type: integer, enum: [0, 1, 2], example: 0 }
                reason:    { type: string, description: "maintenance, provisioning, calibration, diagnostics, probe, soak, backup, identify, restore, or a client's own", example: "" }
                remaining: { type: integer, description: "Seconds left on the lease; -1 = no expiry (the manual switch); 0 = free", example: 0 }
        restore:
          type: object
          description: "Restore-on-boot progress (v3.12). While state is waiting/writing/verifying/homing every bus endpoint answers 503"
          properties:
            state:    { type: string, enum: [idle, waiting, writing, verifying, homing, done, failed, cancelled], example: idle }
            done:     { type: integer, description: "Entries completed in the current phase", example: 0 }
            total:    { type: integer, description: "Entries in the backup being replayed", example: 0 }
            startsIn: { type: integer, description: "Seconds until the run starts (waiting state only)", example: 0 }
        minheap:   { type: integer, description: "Minimum free heap ever observed (bytes)", example: 98000 }
        stk:
          type: object
          description: "Per-task minimum-ever free stack in bytes (stack high-water marks)"
          properties:
            rs485: { type: integer, example: 3100 }
            web:   { type: integer, example: 5200 }
            net:   { type: integer, example: 2900 }
            ota:   { type: integer, example: 2400 }
            rtc:   { type: integer, example: 900 }

    Config:
      type: object
      properties:
        version:      { type: string,  example: "3.5.0", description: "Gateway firmware version. Added in v3.1 and absent on older firmware, so a client can detect a gateway that predates the companion settings store" }
        wSSID:        { type: string,  example: "MyNetwork" }
        mqHost:       { type: string,  example: "192.168.1.50" }
        mqPort:       { type: integer, example: 1883 }
        mqUser:       { type: string,  example: "" }
        mqPfx:        { type: string,  example: "splitflap" }
        baud:         { type: integer, example: 9600 }
        dataBits:     { type: integer, example: 8 }
        parity:       { type: integer, description: "0=None 1=Even 2=Odd", example: 0 }
        stopBits:     { type: integer, example: 1 }
        posixTZ:      { type: string,  example: "EST5EDT,M3.2.0,M11.1.0" }
        ntpServer:    { type: string,  example: "pool.ntp.org" }
        gridRows:     { type: integer, example: 1,  description: "Display wall rows" }
        gridCols:     { type: integer, example: 16, description: "Display wall columns" }
        serialDebug:  { type: boolean, example: false }
        haEnabled:    { type: boolean, description: "true if Home Assistant MQTT discovery is enabled", example: false }
        otaPasswordSet: { type: boolean, description: "true if an OTA password is configured", example: false }
        restoreOnBoot: { type: boolean, description: "Replay the stored calibration backup on every boot (v3.12)", example: false }
        restoreDelay:  { type: integer, description: "Seconds after boot before that replay starts (v3.12)", example: 10 }
        stepMs:        { type: integer, minimum: 0, maximum: 100, description: "Default per-module cascade pacing in ms (v3.13). Stored and reported for clients -- the companion uses it as its default step_ms; the gateway does not pace its own sends by it", example: 15 }
